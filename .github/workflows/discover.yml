name: Discover source candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect posts for editorial review
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/discover_x_theories.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-candidates
          path: |
            data/source-evidence.json
            data/discovery-seeds.json
